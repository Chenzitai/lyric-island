[package]
name = "lyric-island"
version = "0.1.0"
description = "Windows 歌词灵动岛"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lyric_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"

# 阶段三：设置持久化 / 开机自启 / 全局快捷键
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

# 阶段三收尾：关闭窗口时的一次性提示（系统通知是附加项，内联提示才是主路径）
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 歌词请求。用 rustls 避免依赖系统 OpenSSL / Schannel 的差异
# blocking：provider 的 fetch 是同步的，跑在 spawn_blocking 里
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "blocking",
] }

# SMTC = Windows.Media.Control
# Media（不是 Media_Control）提供 MediaPlaybackType，用来区分 Music / Video 会话
windows = { version = "0.61", features = [
  "Media",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Graphics_Imaging",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
base64 = "0.22"

# 窗口标题回退通道要解析"歌名 - 歌手"，正则可配置
regex = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
